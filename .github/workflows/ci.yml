name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [trunk]
permissions:
  contents: read
jobs:
  gate:
    name: ${{ matrix.name }} (fmt, build, units, CLI e2e)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux x86-64, os: ubuntu-latest, arch: x86_64}
          - {name: macOS arm64, os: macos-latest, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: lane-local temporary files
        shell: bash
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          mkdir -p "$HOME/lanes/pm02/tmp"
          echo "TMPDIR=$HOME/lanes/pm02/tmp" >> "$GITHUB_ENV"
      - name: digest-pinned wolf and lupin
        run: tools/fetch-toolchain
      - name: Complete gate including F6 traversal, corpus, roundtrip, 100000 mutations and RSS
        run: bash tools/gauntlet
